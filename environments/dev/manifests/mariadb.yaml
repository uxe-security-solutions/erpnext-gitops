apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
  namespace: erpnext
spec:
  serviceName: mariadb
  replicas: 1

  selector:
    matchLabels:
      app: mariadb

  template:
    metadata:
      labels:
        app: mariadb
    spec:
      containers:
        - name: mariadb
          image: mariadb:10.6

          env:
            - name: MARIADB_ROOT_PASSWORD_FILE
              value: /mnt/secrets-store/erpnext-db-root-password

          ports:
            - containerPort: 3306

          volumeMounts:
            - name: mariadb-data
              mountPath: /var/lib/mysql

            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true

      volumes:
        - name: mariadb-data
          persistentVolumeClaim:
            claimName: erpnext-mariadb

        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: erpnext-keyvault
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  namespace: erpnext
spec:
  selector:
    app: mariadb

  ports:
    - name: mysql
      port: 3306
      targetPort: 3306

  type: ClusterIP
