image:
  repository: cruxeplatformuaen01.azurecr.io/erpnext/dev
  tag: d4b2ede8a60885c0bdfff100613ca1dd1192b51a
  pullPolicy: IfNotPresent

persistence:
  worker:
    enabled: true
    existingClaim: erpnext-sites
    accessModes:
      - ReadWriteOnce

mariadb-sts:
  enabled: false

mariadb-subchart:
  enabled: false

postgresql-sts:
  enabled: false

postgresql-subchart:
  enabled: false

dbHost: mariadb
dbPort: "3306"
dbRootUser: root

dbExistingSecret: erpnext-keyvault-secrets
dbExistingSecretPasswordKey: db-root-password

ingress:
  enabled: true

  ingressName: dev-erpnext

  annotations:
    kubernetes.io/ingress.class: nginx
    argocd.argoproj.io/sync-wave: "20"

  hosts:
    - host: dev-erpnext.uxe.ai
      paths:
        - path: /
          pathType: Prefix

# One-time bench configuration is handled during environment bootstrap.
# Disable it for continuous Argo CD reconciliation because the upstream
# chart generates a timestamped Job name on every render.
jobs:
  configure:
    enabled: false
