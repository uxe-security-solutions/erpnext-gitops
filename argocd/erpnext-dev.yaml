apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: erpnext-dev
  namespace: argocd

spec:
  project: default

  source:
    repoURL: git@github.com:uxe-security-solutions/erpnext-gitops.git
    targetRevision: dev
    path: erpnext

    helm:
      releaseName: frappe-bench
      valueFiles:
        - ../environments/dev/values.yaml

  destination:
    server: https://10.31.1.16:6443
    namespace: erpnext

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
