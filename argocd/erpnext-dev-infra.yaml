apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: erpnext-dev-infra
  namespace: argocd
spec:
  project: default

  source:
    repoURL: git@github.com:uxe-security-solutions/erpnext-gitops.git
    targetRevision: dev
    path: environments/dev/manifests
    directory:
      recurse: true

  destination:
    server: https://10.31.1.16:6443
    namespace: erpnext

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
