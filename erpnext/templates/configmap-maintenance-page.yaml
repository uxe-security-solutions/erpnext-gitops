apiVersion: v1
kind: ConfigMap
metadata:
  name: erpnext-maintenance-page
  namespace: {{ .Release.Namespace }}
data:
  index.html: |
    <!doctype html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <meta http-equiv="refresh" content="15">

      <title>ERPNext Maintenance</title>

      <style>
        * {
          box-sizing: border-box;
        }

        body {
          margin: 0;
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: Arial, Helvetica, sans-serif;
          background: #f5f7fa;
          color: #1f2937;
        }

        .card {
          width: min(92%, 620px);
          padding: 48px;
          background: #ffffff;
          border-radius: 16px;
          box-shadow: 0 15px 45px rgba(0, 0, 0, 0.08);
          text-align: center;
        }

        h1 {
          margin: 0 0 20px;
          font-size: 32px;
        }

        .message {
          font-size: 17px;
          color: #6b7280;
          line-height: 1.7;
        }

        .status {
          margin-top: 32px;
          font-size: 20px;
          font-weight: 600;
        }

        .spinner {
          width: 42px;
          height: 42px;
          margin: 28px auto;
          border: 4px solid #e5e7eb;
          border-top-color: #374151;
          border-radius: 50%;
          animation: spin 1s linear infinite;
        }

        @keyframes spin {
          to {
            transform: rotate(360deg);
          }
        }

        .small {
          margin-top: 26px;
          color: #9ca3af;
          font-size: 13px;
        }
      </style>
    </head>

    <body>
      <div class="card">

        <h1>Scheduled Maintenance</h1>

        <div class="message">
          ERPNext is currently being updated.
          <br><br>
          The service will automatically become available
          once deployment validation is complete.
        </div>

        <div class="spinner"></div>

        <div class="status">
          Maintenance in progress...
        </div>

        <div class="small">
          This page automatically refreshes every 15 seconds.
        </div>

      </div>
    </body>
    </html>
