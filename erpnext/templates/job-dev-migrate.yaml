apiVersion: batch/v1
kind: Job
metadata:
  name: frappe-bench-erpnext-migrate
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-10"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation

spec:
  backoffLimit: 1

  template:
    metadata:
      labels:
        app.kubernetes.io/name: erpnext-migrate
        app.kubernetes.io/instance: {{ .Release.Name }}

    spec:
      restartPolicy: Never

      securityContext:
        supplementalGroups:
          - 1000

      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          command:
            - bash
            - -c

          args:
            - |
              set -euo pipefail

              SITE="dev-erpnext.uxe.ai"

              echo "========================================"
              echo "ERPNext pre-migration backup"
              echo "Site: ${SITE}"
              echo "========================================"

              bench --site "${SITE}" backup --with-files

              echo
              echo "Backup completed successfully."
              echo "Backup directory:"
              ls -lh "sites/${SITE}/private/backups/"

              echo
              echo "========================================"
              echo "Starting ERPNext migration"
              echo "========================================"

              bench --site "${SITE}" migrate

              echo
              echo "========================================"
              echo "Clearing ERPNext caches"
              echo "========================================"

              bench --site "${SITE}" clear-cache
              bench --site "${SITE}" clear-website-cache

              echo
              echo "========================================"
              echo "Migration and cache clearing completed successfully"
              echo "========================================"

          volumeMounts:
            - name: sites-dir
              mountPath: /home/frappe/frappe-bench/sites

      volumes:
        - name: sites-dir
          persistentVolumeClaim:
            claimName: erpnext-sites
